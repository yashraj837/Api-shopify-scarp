name: Shopify Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python -u scraper.py

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopify-stores-results
          path: shopify_stores.csv
          retention-days: 90
